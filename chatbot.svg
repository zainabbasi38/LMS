<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Head -->
  <rect x="20" y="20" rx="20" ry="20" width="80" height="70" fill="#4F46E5"/>

  <!-- Antenna -->
  <line x1="60" y1="10" x2="60" y2="20" stroke="#4F46E5" stroke-width="4"/>
  <circle cx="60" cy="8" r="4" fill="#4F46E5"/>

  <!-- Eyes -->
  <circle cx="45" cy="50" r="6" fill="#ffffff"/>
  <circle cx="75" cy="50" r="6" fill="#ffffff"/>

  <!-- Mouth -->
  <rect x="45" y="65" rx="5" ry="5" width="30" height="6" fill="#ffffff"/>

  <!-- Chat bubble tail -->
  <polygon points="50,90 60,105 70,90" fill="#4F46E5"/>
</svg>
