<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Library</title>
    <link rel="stylesheet" href="admin.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
        }
        .sidebar {
            min-height: 100vh;
            background: white;
            border-radius: 12px;
        }
        .sidebar a {
            text-decoration: none;
            color: #333;
        }
        .active {
            background: #e7f1ff;
            border-radius: 8px;
            color: #0d6efd !important;
            font-weight: 500;
        }
        .card {
            border: none;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container-fluid p-4">
    <div class="row g-4">

        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div class="sidebar p-3 shadow-sm">
                <div class="text-center mb-4">
                    <img src="https://i.pravatar.cc/80?img=12" class="rounded-circle mb-2">
                    <h6 class="mb-0">Admin Panel</h6>
                    <small class="text-muted">Library Admin</small>
                </div>

                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-book me-2"></i>Manage Books</a>
                    </li>
                    <li class="nav-item">
                        <button  onclick="logout()">

                            <a class="nav-link" href="#"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
                        </button>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10">
            <h3 class="fw-bold">Admin Dashboard</h3>
            <p class="text-muted">Manage library books easily</p>

            <!-- Add Book Form -->
            <div class="card shadow-sm p-4 mb-4">
                <h5 class="fw-bold mb-3">Add New Book</h5>

                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="bookTitle" class="form-control" placeholder="Book Title">
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="bookAuthor" class="form-control" placeholder="Author">
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="bookURL" class="form-control" placeholder="Image URL">
                    </div>
                    <div class="col-md-2 d-grid">
                        <button type="submit" class="btn btn-primary" onclick="addBook()" >Add Book</button>
                    </div>
                </div>
            </div>

            <!-- Book List -->
            <div class="card shadow-sm p-4">
                <h5 class="fw-bold mb-3">Books List</h5>

                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Title</th>
                                <th>Author</th>
                                <th>Image URl</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="bookTable">
                            <!-- <tr>
                                <td>1</td>
                                <td>Clean Code</td>
                                <td>Robert C. Martin</td>
                                <td>9780132350884</td>
                                <td>
                                    <button class="btn btn-danger btn-sm" onclick="deleteBook(this)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr> -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
